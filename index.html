<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taiwan Urban Planning Review · 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --amber: #D4702A;
    --deep-orange: #B8441A;
    --sunset-gold: #E8943A;
    --charcoal: #1C1C1E;
    --smoke: #2E2E30;
    --sand: #F2E8DA;
    --warm-grey: #8A8078;
    --light-sand: #FAF5EE;
    --ink: #111010;
    --muted: #6B6560;
    --nav-height: 56px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

 body {
  font-family: 'DM Sans', sans-serif;
  background: var(--charcoal);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden; 
}

.frame-wrap {
  flex: 1;
  position: relative;
  overflow-y: auto; 
  -webkit-overflow-scrolling: touch;
}

  /* ── TOP NAV BAR ── */
  nav {
    background: var(--charcoal);
    border-bottom: 3px solid var(--amber);
    height: var(--nav-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
    gap: 12px;
    z-index: 100;
  }

  .nav-brand {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--sand);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .nav-pages {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-pages::-webkit-scrollbar { display: none; }

  .page-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 2px;
    white-space: nowrap;
    transition: all 0.2s ease;
  }

  .page-btn:hover {
    color: var(--sand);
    border-color: var(--smoke);
    background: var(--smoke);
  }

  .page-btn.active {
    background: var(--amber);
    color: #fff;
    border-color: var(--amber);
  }

  /* Arrow buttons */
  .nav-arrows {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .arrow-btn {
    background: var(--smoke);
    border: 1px solid #3a3a3c;
    color: var(--sand);
    width: 30px;
    height: 30px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .arrow-btn:hover { background: var(--amber); border-color: var(--amber); }
  .arrow-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .arrow-btn:disabled:hover { background: var(--smoke); border-color: #3a3a3c; }

  /* ── IFRAME ── */
  .frame-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: var(--light-sand);
  }

  /* Transition overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: var(--charcoal);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }

  .overlay.fading { opacity: 1; pointer-events: all; }

  /* Page counter */
  .page-counter {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .page-counter span { color: var(--amber); }

  /* Credit */
  .nav-credit {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.08em;
    white-space: nowrap;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">Taiwan Urban <span style="color: var(--amber);">Planning Review</span></div>

  <div class="nav-pages" id="navPages">
    <button class="page-btn active" onclick="goToPage(0)">Page 1</button>
    <button class="page-btn" onclick="goToPage(1)">Page 2</button>
    <button class="page-btn" onclick="goToPage(2)">Page 3</button>
    <button class="page-btn" onclick="goToPage(3)">Page 4</button>
    <button class="page-btn" onclick="goToPage(4)">Page 5</button>
    <button class="page-btn" onclick="goToPage(5)">Page 6</button>
    <button class="page-btn" onclick="goToPage(6)">Page 7</button>
    <button class="page-btn" onclick="goToPage(7)">Page 8</button>
  </div>

  <div class="nav-arrows">
    <button class="arrow-btn" id="prevBtn" onclick="prevPage()" disabled>&#8592;</button>
    <button class="arrow-btn" id="nextBtn" onclick="nextPage()">&#8594;</button>
  </div>

  <div class="page-counter"><span id="currentNum">1</span> / 8</div>

  <div class="nav-credit">A Project by Ethan Russello</div>
</nav>

<div class="frame-wrap">
  <div class="overlay" id="overlay"></div>
  <iframe id="mainFrame" src="section1-intro.html"></iframe>
</div>

<script>
  const pages = [
  "section1-intro.html",
    "section2-transit.html",
    "section3-housing.html",
    "section4-beitou.html",
    "section5-nature.html",
    "section6-transit-networks-2.html",
    "section-youbike-5.html",
    "kaohsiung-essay.html"
  ];

  let current = 0;
  let isTransitioning = false;

  function goToPage(index) {
    if (index === current || isTransitioning) return;

    isTransitioning = true;
    const overlay = document.getElementById('overlay');
    const frame = document.getElementById('mainFrame');

    overlay.classList.add('fading');

    setTimeout(() => {
      current = index;
      frame.src = pages[current];
      updateNav();
      
      // Wait for iframe to load before fading out overlay
      frame.onload = () => {
        overlay.classList.remove('fading');
        isTransitioning = false;
      };
      
      // Fallback timeout in case onload doesn't fire
      setTimeout(() => {
        overlay.classList.remove('fading');
        isTransitioning = false;
      }, 600);
    }, 250);
  }

  function prevPage() { 
    if (current > 0 && !isTransitioning) goToPage(current - 1); 
  }

  function nextPage() { 
    if (current < pages.length - 1 && !isTransitioning) goToPage(current + 1); 
  }

  function updateNav() {
    document.querySelectorAll('.page-btn').forEach((btn, i) => {
      btn.classList.toggle('active', i === current);
    });
    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === pages.length - 1;
    document.getElementById('currentNum').textContent = current + 1;
  }

  // Keyboard arrow navigation
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') nextPage();
    if (e.key === 'ArrowLeft') prevPage();
  });
</script>

</body>
</html>
